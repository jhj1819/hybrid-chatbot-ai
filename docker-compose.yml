version: '3.8'

services:
  ai-server:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env  # .env 파일에서 환경 변수 자동 로드
    environment:
      - PORT=8000
      - WORKERS=1
      - PYTHONPATH=/app
    volumes:
      - ./faiss_index:/app/faiss_index
      - ./knowledge:/app/knowledge
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
